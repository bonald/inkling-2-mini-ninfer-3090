<svg xmlns="http://www.w3.org/2000/svg" width="960" height="128" viewBox="0 0 960 128" role="img" aria-labelledby="t d">
<title id="t">Inkling 2 Mini on an RTX 3090 at a glance</title>
<desc id="d">125.94 decode tokens per second, 96.7% of HyperQwen, 96.77% top-token agreement with vanilla Q4, 65,536-token context.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1628"/><stop offset="1" stop-color="#070b16"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="227" height="127" rx="14" fill="url(#bg)" stroke="#1e293b"/>
<text x="22" y="32" font-size="11" font-weight="600" letter-spacing="1.4" fill="#94a3b8">DECODE SPEED</text>
<text x="22" y="78" font-size="36" font-weight="700" fill="url(#ink)">125.94<tspan font-size="14" font-weight="600" fill="#94a3b8"> tok/s</tspan></text>
<text x="22" y="106" font-size="12.5" fill="#94a3b8">+29.2% over tuned llama.cpp</text>
<rect x="244.5" y="0.5" width="227" height="127" rx="14" fill="url(#bg)" stroke="#1e293b"/>
<text x="266" y="32" font-size="11" font-weight="600" letter-spacing="1.4" fill="#94a3b8">VS HYPERQWEN</text>
<text x="266" y="78" font-size="36" font-weight="700" fill="url(#ink)">96.7%</text>
<text x="266" y="106" font-size="12.5" fill="#94a3b8">of Qwen3.8-27B's 130.20 tok/s</text>
<rect x="488.5" y="0.5" width="227" height="127" rx="14" fill="url(#bg)" stroke="#1e293b"/>
<text x="510" y="32" font-size="11" font-weight="600" letter-spacing="1.4" fill="#94a3b8">TOKEN AGREEMENT</text>
<text x="510" y="78" font-size="36" font-weight="700" fill="url(#ink)">96.77%</text>
<text x="510" y="106" font-size="12.5" fill="#94a3b8">top-token match vs vanilla Q4</text>
<rect x="732.5" y="0.5" width="227" height="127" rx="14" fill="url(#bg)" stroke="#1e293b"/>
<text x="754" y="32" font-size="11" font-weight="600" letter-spacing="1.4" fill="#94a3b8">CONTEXT</text>
<text x="754" y="78" font-size="36" font-weight="700" fill="url(#ink)">65,536<tspan font-size="14" font-weight="600" fill="#94a3b8"> tokens</tspan></text>
<text x="754" y="106" font-size="12.5" fill="#94a3b8">text and images, one GPU</text>
</g>
</svg>
