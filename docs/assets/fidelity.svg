<text x="32" y="48" font-size="20" font-weight="600" fill="#f1f5f9">Fidelity to vanilla Q4</text>
<text x="32" y="72" font-size="13" fill="#94a3b8">Reference: the publisher's Q4 GGUF on unmodified llama.cpp. Eight 512-token WikiText-2 windows, all 200,058 logits scored.</text>
