<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
<title id="t">Fidelity to vanilla Q4</title>
<desc id="d">3,956 of 4,088 top-token predictions match vanilla Q4 (96.77%). 127 disagreements chose vanilla's runner-up and 5 chose its rank 3 to 5. Perplexity 9.25762 versus 9.23235. 92 of 95 fixed-prefix choices matched. Answers 12/12 greedy and 23/24 sampled versus 11/12 and 23/24. 3 of 6 free continuations identical, mean similarity 0.781.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1628"/><stop offset="1" stop-color="#070b16"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<clipPath id="barclip"><rect x="32" y="142" width="896" height="22" rx="4"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="959" height="339" rx="16" fill="url(#bg)" stroke="#1e293b"/>
