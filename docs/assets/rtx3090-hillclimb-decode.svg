<svg xmlns="http://www.w3.org/2000/svg" width="960" height="472" viewBox="0 0 960 472" role="img" aria-labelledby="t d">
<title id="t">Inkling 2 Mini RTX 3090 (250 W) Optimization: Decode Throughput Across Contexts</title>
<desc id="d">Decode tokens per second across short greedy, c1 sampled median, 39.3K context, and 75.2K context comparing clean F16 baseline, F16 with K1-v2/K2/K3 kernels, and MXFP8 with K1-v2/K2/K3 kernels.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1628"/><stop offset="1" stop-color="#070b16"/></linearGradient>
<linearGradient id="mxfp8" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="f16opt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<filter id="glow" x="-10%" y="-80%" width="120%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect x="0.5" y="0.5" width="959" height="471" rx="16" fill="url(#bg)" stroke="#1e293b"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<text x="32" y="42" font-size="20" font-weight="700" fill="#f1f5f9">RTX 3090 (250 W Cap) — Decode Throughput Across Contexts</text>
<text x="32" y="64" font-size="12.5" fill="#94a3b8">Control-bracketed A/B runs on UD-IQ4_XS + DSpark (706.2 GB/s measured copy BW; 100% 3/3 needle retrieval on all long-context runs)</text>

<!-- Legend -->
<rect x="32" y="78" width="12" height="12" rx="3" fill="#475569"/>
<text x="50" y="88" font-size="12" fill="#cbd5e1">Clean F16 Baseline</text>
<rect x="184" y="78" width="12" height="12" rx="3" fill="url(#f16opt)"/>
<text x="202" y="88" font-size="12" fill="#cbd5e1">F16 + K1-v2 / K2-32K / K3 (lossless)</text>
<rect x="432" y="78" width="12" height="12" rx="3" fill="url(#mxfp8)"/>
<text x="450" y="88" font-size="12" font-weight="600" fill="#f8fafc">MXFP8 KV + K1-v2 / K2-32K / K3 (trained KV, −1.18 GiB)</text>

<!-- Grid lines: x=220 -> 0 tok/s, x=796 -> 160 tok/s (scale = 3.6 px per tok/s) -->
<line x1="220" y1="106" x2="220" y2="392" stroke="#1e293b" stroke-width="1"/>
<text x="220" y="410" font-size="11" fill="#64748b" text-anchor="middle">0</text>
<line x1="364" y1="106" x2="364" y2="392" stroke="#1e293b" stroke-width="1"/>
<text x="364" y="410" font-size="11" fill="#64748b" text-anchor="middle">40</text>
<line x1="508" y1="106" x2="508" y2="392" stroke="#1e293b" stroke-width="1"/>
<text x="508" y="410" font-size="11" fill="#64748b" text-anchor="middle">80</text>
<line x1="652" y1="106" x2="652" y2="392" stroke="#1e293b" stroke-width="1"/>
<text x="652" y="410" font-size="11" fill="#64748b" text-anchor="middle">120</text>
<line x1="796" y1="106" x2="796" y2="392" stroke="#1e293b" stroke-width="1"/>
<text x="796" y="410" font-size="11" fill="#64748b" text-anchor="middle">160</text>
<text x="928" y="410" font-size="11" fill="#64748b" text-anchor="end">decode tokens/s</text>

<!-- Group 1: Short Greedy (512 tok) y=114..168 -->
<text x="32" y="136" font-size="13.5" font-weight="600" fill="#e2e8f0">Short Greedy</text>
<text x="32" y="153" font-size="11.5" fill="#94a3b8">512 tok, temp=0</text>
<rect x="220" y="114" width="451.7" height="15" rx="4" fill="#475569"/>
<text x="680" y="126" font-size="12" fill="#94a3b8">125.46</text>
<rect x="220" y="133" width="502.5" height="15" rx="4" fill="url(#f16opt)"/>
<text x="731" y="145" font-size="12" font-weight="600" fill="#bae6fd">139.57</text>
<rect x="220" y="152" width="501.3" height="17" rx="4" fill="url(#mxfp8)" opacity="0.4" filter="url(#glow)"/>
<rect x="220" y="152" width="501.3" height="17" rx="4" fill="url(#mxfp8)"/>
<text x="731" y="165" font-size="13" font-weight="700" fill="#f8fafc">139.25</text>
<rect x="854" y="149" width="74" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
<text x="891" y="164" font-size="12" font-weight="700" fill="#67e8f9" text-anchor="middle">+11.0%</text>

<!-- Group 2: c1 Sampled Median (6 prompts) y=188..242 -->
<text x="32" y="210" font-size="13.5" font-weight="600" fill="#e2e8f0">c1 Sampled (med)</text>
<text x="32" y="227" font-size="11.5" fill="#94a3b8">6 prompts × 512 tok, temp=1</text>
<rect x="220" y="188" width="378.6" height="15" rx="4" fill="#475569"/>
<text x="607" y="200" font-size="12" fill="#94a3b8">105.18 (5-run med)</text>
<rect x="220" y="207" width="416.7" height="15" rx="4" fill="url(#f16opt)"/>
<text x="645" y="219" font-size="12" font-weight="600" fill="#bae6fd">115.75 (7-run med)</text>
<rect x="220" y="226" width="418.8" height="17" rx="4" fill="url(#mxfp8)" opacity="0.4" filter="url(#glow)"/>
<rect x="220" y="226" width="418.8" height="17" rx="4" fill="url(#mxfp8)"/>
<text x="647" y="239" font-size="13" font-weight="700" fill="#f8fafc">116.34</text>
<rect x="854" y="223" width="74" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
<text x="891" y="238" font-size="12" font-weight="700" fill="#67e8f9" text-anchor="middle">+10.6%</text>

<!-- Group 3: 39.3K Context (50% of 80K) y=262..316 -->
<text x="32" y="284" font-size="13.5" font-weight="600" fill="#e2e8f0">39.3K Context</text>
<text x="32" y="301" font-size="11.5" fill="#94a3b8">50% of 80K, 3/3 needles</text>
<rect x="220" y="262" width="313.1" height="15" rx="4" fill="#475569"/>
<text x="541" y="274" font-size="12" fill="#94a3b8">86.97</text>
<rect x="220" y="281" width="397.4" height="15" rx="4" fill="url(#f16opt)"/>
<text x="626" y="293" font-size="12" font-weight="600" fill="#bae6fd">110.38 (qual) / 96.51 (w3)</text>
<rect x="220" y="300" width="329.8" height="17" rx="4" fill="url(#mxfp8)" opacity="0.4" filter="url(#glow)"/>
<rect x="220" y="300" width="329.8" height="17" rx="4" fill="url(#mxfp8)"/>
<text x="558" y="313" font-size="13" font-weight="700" fill="#f8fafc">91.60</text>
<rect x="854" y="297" width="74" height="22" rx="11" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5"/>
<text x="891" y="312" font-size="12" font-weight="700" fill="#7dd3fc" text-anchor="middle">+26.9% F16</text>

<!-- Group 4: 75.2K Context (95% of 80K) y=336..390 -->
<text x="32" y="358" font-size="13.5" font-weight="600" fill="#e2e8f0">75.2K Context</text>
<text x="32" y="375" font-size="11.5" fill="#94a3b8">95% of 80K, 3/3 needles</text>
<rect x="220" y="336" width="235.5" height="15" rx="4" fill="#475569"/>
<text x="464" y="348" font-size="12" fill="#94a3b8">65.42</text>
<rect x="220" y="355" width="285.7" height="15" rx="4" fill="url(#f16opt)"/>
<text x="514" y="367" font-size="12" font-weight="600" fill="#bae6fd">79.37 (qual) / 73.53 (w3)</text>
<rect x="220" y="374" width="288.7" height="17" rx="4" fill="url(#mxfp8)" opacity="0.4" filter="url(#glow)"/>
<rect x="220" y="374" width="288.7" height="17" rx="4" fill="url(#mxfp8)"/>
<text x="517" y="387" font-size="13" font-weight="700" fill="#f8fafc">80.19</text>
<rect x="854" y="371" width="74" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
<text x="891" y="386" font-size="12" font-weight="700" fill="#67e8f9" text-anchor="middle">+22.6%</text>

<!-- Footer callout -->
<text x="32" y="446" font-size="12.5" fill="#94a3b8">Extended MXFP8 / rk8v4 unlocks: <tspan fill="#67e8f9" font-weight="700">121.2K ctx @ 51.0 tok/s (3/3)</tspan> · <tspan fill="#c084fc" font-weight="700">148.6K ctx (rk8v4) @ 53.8 tok/s (3/3)</tspan> · <tspan fill="#fcd34d" font-weight="700">c=2 @ 140.9 agg tok/s</tspan></text>
</g>
</svg>
